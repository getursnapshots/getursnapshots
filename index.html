<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Snap Shots | Professional Reels, Photography &amp; Videography</title>
    <meta name="description" content="Professional reels, photography and videography for events, brands, businesses and social media." />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Snap Shots | Professional Reels, Photography &amp; Videography" />
    <meta property="og:description" content="Professional reels, photography and videography for events, brands, businesses and social media." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Snap Shots" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Snap Shots | Professional Reels, Photography &amp; Videography" />
    <meta name="twitter:description" content="Professional reels, photography and videography for events, brands, businesses and social media." />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data: Organization, Service & FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://snapshotsstudio.com/#organization",
          "name": "SNAP SHOTS",
          "description": "Professional Instagram Reels, photography, videography and social-media content creation.",
          "url": "https://snapshotsstudio.com",
          "priceRange": "₹₹",
          "telephone": "+91-90143-19818",
          "openingHours": "Mo-Su 08:00-22:00",
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Snap Shots Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Event Reels" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Wedding Reels" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Birthday Reels" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Corporate Reels" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Product Reels" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Brand Content" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social Media Content" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Photography" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Videography" } }
            ]
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://snapshotsstudio.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How do I book a shoot?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Booking is instant and hassle-free. Fill out the booking form on our website with your event type, date, time, and location, or connect directly with our coordination desk via WhatsApp. We confirm your slot and assign your creator within minutes."
              }
            },
            {
              "@type": "Question",
              "name": "What types of reels do you create?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We produce viral-ready vertical 9:16 reels for Weddings, Birthdays, Private Celebrations, Corporate Summits, Product Reveals, Fashion BTS, and Influencer Content—curated with trending audio and color grading."
              }
            },
            {
              "@type": "Question",
              "name": "Do you cover events?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! We specialize in on-ground event coverage from intimate private dinners and birthday bashes to grand destination weddings, music festivals, club concerts, and multi-day corporate conferences."
              }
            },
            {
              "@type": "Question",
              "name": "Do you provide photography?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Absolutely. Alongside cinematic vertical reels, our shoot packages include high-resolution graded photographs and portrait captures optimized for Instagram carousels and album keepsakes."
              }
            },
            {
              "@type": "Question",
              "name": "How quickly will I receive my content?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Speed is our trademark. We deliver same-day reels—often within 2 to 6 hours after your shoot wraps, allowing you to post while the event buzz is at its peak."
              }
            },
            {
              "@type": "Question",
              "name": "Can I request a custom package?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. If your requirements span multi-day events, multiple camera operators, drone footage, or specific brand styling, our team can tailor a bespoke shoot package."
              }
            },
            {
              "@type": "Question",
              "name": "Do you provide raw footage?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! All shoot packages include secure cloud access to your complete uncompressed 4K raw footage and clips for your personal archives and future edits."
              }
            },
            {
              "@type": "Question",
              "name": "Can I book a shoot for social media content?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Definitely. We work with content creators, businesses, restaurants, gyms, and lifestyle influencers for monthly content batches, trend remakes, and product unboxings."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-[#bd1616] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
